[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-review"
version = "0.1.0"
description = "AI-powered pre-commit/pre-push code review gate. Reviews staged diff for null-safety, imports, name collisions, logic bugs, naming, and better patterns before code lands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ravi Gupta", email = "gravi5964@gmail.com" }]
keywords = ["git", "pre-commit", "code-review", "llm", "ai", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
commit-review = "commit_review.cli:main"

[project.urls]
Homepage = "https://github.com/ravigupta0210/commit-review"
Issues = "https://github.com/ravigupta0210/commit-review/issues"

[tool.setuptools.packages.find]
include = ["commit_review*"]

[tool.ruff]
line-length = 100
target-version = "py39"
